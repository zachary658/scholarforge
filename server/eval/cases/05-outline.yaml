  vars:
    fixture: good-literature-review
    tool: literature_review
    topic: '深度学习在医学影像分割中的应用'
    field: '计算机科学'
    keywords: '深度学习,医学影像,分割'
    outline: '["引言","主题分类梳理","研究述评","研究展望"]'
    references: '[{"authors":"Ronneberger O., Fischer P., Brox T.","title":"U-Net: Convolutional Networks for Biomedical Image Segmentation","journal":"MICCAI","year":"2015","abstract":"该文提出编码器-解码器结构的 U-Net 分割网络，在公开医学影像分割数据集上取得显著进展，Dice 系数达到 87.4%。"}]'
  metadata:
    dimension: outline
    expectation: pass
  assert:
    - type: javascript
      value: file://server/scripts/promptfoo-assertions.mjs:assertOutlineConsistency

