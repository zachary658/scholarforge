    field: '临床医学'
    keywords: '电子病历,风险预测,机器学习'
    outline: '["摘要","引言","研究方法","结果与分析","结论"]'
    terms: '心血管疾病'
    references: '[{"authors":"张宏, 李静","title":"基于电子病历的心血管疾病风险预测模型研究","journal":"中华心血管病杂志","year":"2022","abstract":"该文基于电子病历构建心血管疾病风险预测模型，在随访队列中 AUC 达到 0.86。"},{"authors":"Wang Y., Liu H.","title":"Machine learning for cardiovascular risk prediction: a systematic review","journal":"The Lancet Digital Health","year":"2023","abstract":"该综述比较多种机器学习心血管风险预测模型，指出外部验证不足导致预测准确率普遍下降。"},{"authors":"陈立, 周敏","title":"心血管风险预测模型的外部验证与校准研究","journal":"中华流行病学杂志","year":"2024","abstract":"该文对心血管风险预测模型进行外部验证，结果显示校准之后预测准确率提升至 82.6%。"},{"authors":"赵鹏, 吴桐","title":"可解释机器学习在临床预测模型中的应用","journal":"中国医院管理","year":"2023","abstract":"该文讨论可解释机器学习在临床预测模型中的应用，强调可解释性是临床预测模型落地的必要条件。"}]'
