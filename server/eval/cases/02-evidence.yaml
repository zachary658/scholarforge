# 维度 2：每条事实能否定位到证据
# 断言：assertEvidenceTraceable —— 声明性段落需带 [EVIDENCE:id source=... page=... chunk=...]
#       标记，可溯源段落占比即 score，低于 minCoverage 判 fail。
# 参考：https://www.promptfoo.dev/docs/configuration/expected-outputs/javascript/

- description: '计算机/医学影像分割 综述：6 个声明性段落全部带证据标记'
  vars:
    fixture: good-literature-review
    tool: literature_review
    topic: '深度学习在医学影像分割中的应用'
    field: '计算机科学'
    keywords: '深度学习,医学影像,分割'
    outline: '["引言","主题分类梳理","研究述评","研究展望"]'
    terms: '医学影像分割'
    references: '[{"authors":"Ronneberger O., Fischer P., Brox T.","title":"U-Net: Convolutional Networks for Biomedical Image Segmentation","journal":"MICCAI","year":"2015","abstract":"该文提出编码器-解码器结构的 U-Net 分割网络，在公开医学影像分割数据集上取得显著进展，Dice 系数达到 87.4%。"},{"authors":"Chen J., Lu Y., Yu Q.","title":"TransUNet: Transformers Make Strong Encoders for Medical Image Segmentation","journal":"arXiv","year":"2021","abstract":"该文将视觉 Transformer 引入医学影像分割，在 Synapse 多器官分割数据集上平均 Dice 系数达到 84.3%。"},{"authors":"李文, 张涛, 陈静","title":"半监督医学影像分割方法综述","journal":"自动化学报","year":"2022","abstract":"该文综述一致性正则化与伪标签两类半监督医学影像分割方法，指出在标注受限场景下分割准确率可达 91.2%。"},{"authors":"王磊, 孙明","title":"医学影像分割的域泛化问题研究","journal":"计算机学报","year":"2023","abstract":"该文分析多中心数据分布偏移对分割模型泛化能力的影响，指出跨域泛化与小目标分割仍是主要难点。"},{"authors":"Isensee F., Jaeger P.","title":"nnU-Net: a self-configuring method for biomedical image segmentation","journal":"Nature Methods","year":"2021","abstract":"该文提出医学影像分割的自动化配置流程，强调构建多中心大规模评测基准是后续研究的关键方向。"}]'
    benchmarks: '[{"paperTitle":"U-Net","paperYear":"2015","metrics":[{"label":"Dice","value":87.4}]},{"paperTitle":"TransUNet","paperYear":"2021","metrics":[{"label":"Dice","value":84.3}]},{"paperTitle":"半监督一致性正则化","paperYear":"2022","metrics":[{"label":"准确率","value":91.2}]}]'
  metadata:
    dimension: evidence
    expectation: pass
  assert:
    - type: javascript
      value: file://scripts/promptfoo-assertions.mjs
      config:
        fn: assertEvidenceTraceable
        minCoverage: 1

- description: '医学/心血管风险预测：证据覆盖率要求 100%'
