# 维度 1：引用是否真实存在
# 断言：assertCitationsExist —— 正文 [n] 编号必须能映射到检索返回的真实文献列表，
#       且第 n 条文献确实出现在文末参考文献里；正文出现的 DOI 也必须能在文献列表中找到。
# 参考：https://www.promptfoo.dev/docs/configuration/expected-outputs/javascript/

- description: '计算机/医学影像分割 综述：引文编号 [1]-[5] 全部可映射到真实文献'
  vars:
    fixture: good-literature-review
    tool: literature_review
    topic: '深度学习在医学影像分割中的应用'
    field: '计算机科学'
    keywords: '深度学习,医学影像,分割'
    years: '近5年'
    outline: '["引言","主题分类梳理","研究述评","研究展望"]'
    terms: '医学影像分割'
    references: '[{"authors":"Ronneberger O., Fischer P., Brox T.","title":"U-Net: Convolutional Networks for Biomedical Image Segmentation","journal":"MICCAI","year":"2015","doi":"10.1007/978-3-319-24574-4_28","abstract":"该文提出编码器-解码器结构的 U-Net 分割网络，在公开医学影像分割数据集上取得显著进展，Dice 系数达到 87.4%。"},{"authors":"Chen J., Lu Y., Yu Q.","title":"TransUNet: Transformers Make Strong Encoders for Medical Image Segmentation","journal":"arXiv","year":"2021","doi":"10.48550/arXiv.2102.04306","abstract":"该文将视觉 Transformer 引入医学影像分割，在 Synapse 多器官分割数据集上平均 Dice 系数达到 84.3%。"},{"authors":"李文, 张涛, 陈静","title":"半监督医学影像分割方法综述","journal":"自动化学报","year":"2022","doi":"10.16383/j.aas.c200100","abstract":"该文综述一致性正则化与伪标签两类半监督医学影像分割方法，指出在标注受限场景下分割准确率可达 91.2%。"},{"authors":"王磊, 孙明","title":"医学影像分割的域泛化问题研究","journal":"计算机学报","year":"2023","doi":"10.11897/SP.J.1016.2023.00001","abstract":"该文分析多中心数据分布偏移对分割模型泛化能力的影响，指出跨域泛化与小目标分割仍是主要难点。"},{"authors":"Isensee F., Jaeger P.","title":"nnU-Net: a self-configuring method for biomedical image segmentation","journal":"Nature Methods","year":"2021","doi":"10.1038/s41592-020-01008-z","abstract":"该文提出医学影像分割的自动化配置流程，强调构建多中心大规模评测基准是后续研究的关键方向。"}]'
    benchmarks: '[{"paperTitle":"U-Net","paperYear":"2015","metrics":[{"label":"Dice","value":87.4}]},{"paperTitle":"TransUNet","paperYear":"2021","metrics":[{"label":"Dice","value":84.3}]},{"paperTitle":"半监督一致性正则化","paperYear":"2022","metrics":[{"label":"准确率","value":91.2}]}]'
  metadata:
    dimension: citations
    expectation: pass
  assert:
    - type: javascript
      value: file://server/scripts/promptfoo-assertions.mjs:assertCitationsExist

- description: '医学/心血管风险预测 期刊论文：4 条引文均可映射且题名出现在文末参考文献'
  vars:
    fixture: good-medical
    tool: journal
    topic: '基于电子病历的心血管疾病风险预测模型研究'
    field: '临床医学'
    keywords: '电子病历,风险预测,机器学习'
    outline: '["摘要","引言","研究方法","结果与分析","结论"]'
    terms: '心血管疾病'
    references: '[{"authors":"张宏, 李静","title":"基于电子病历的心血管疾病风险预测模型研究","journal":"中华心血管病杂志","year":"2022","doi":"10.3760/cma.j.cn112148-20220101-00012","abstract":"该文基于电子病历构建心血管疾病风险预测模型，在随访队列中 AUC 达到 0.86。"},{"authors":"Wang Y., Liu H.","title":"Machine learning for cardiovascular risk prediction: a systematic review","journal":"The Lancet Digital Health","year":"2023","doi":"10.1016/S2589-7500(23)00012-3","abstract":"该综述比较多种机器学习心血管风险预测模型，指出外部验证不足导致预测准确率普遍下降。"},{"authors":"陈立, 周敏","title":"心血管风险预测模型的外部验证与校准研究","journal":"中华流行病学杂志","year":"2024","doi":"10.3760/cma.j.cn112338-20240101-00033","abstract":"该文对心血管风险预测模型进行外部验证，结果显示校准之后预测准确率提升至 82.6%。"},{"authors":"赵鹏, 吴桐","title":"可解释机器学习在临床预测模型中的应用","journal":"中国医院管理","year":"2023","doi":"10.3969/j.issn.1001-5329.2023.05.018","abstract":"该文讨论可解释机器学习在临床预测模型中的应用，强调可解释性是临床预测模型落地的必要条件。"}]'
    benchmarks: '[{"paperTitle":"电子病历基线模型","paperYear":"2022","metrics":[{"label":"AUC","value":0.86}]},{"paperTitle":"外部验证校准模型","paperYear":"2024","metrics":[{"label":"准确率","value":82.6}]}]'
  metadata:
    dimension: citations
    expectation: pass
  assert:
    - type: javascript
      value: file://server/scripts/promptfoo-assertions.mjs:assertCitationsExist
      config:
        checkDoi: true

