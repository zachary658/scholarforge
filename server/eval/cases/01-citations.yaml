    outline: '["引言","制度背景与文献回顾","实证设计与结果","结论与启示"]'
    terms: '融资约束'
    references: '[{"authors":"周涛, 林曦","title":"ESG 信息披露与制造业企业融资约束","journal":"会计研究","year":"2023","doi":"10.3969/j.issn.1003-2886.2023.04.007","abstract":"该文检验 ESG 信息披露与企业融资约束的关系，发现披露质量提升之后融资约束指数下降 18.6%。"},{"authors":"Green T., Ma L.","title":"Mandatory ESG disclosure and capital market consequences","journal":"Journal of Accounting Research","year":"2022","doi":"10.1111/1475-679X.12456","abstract":"该文研究强制 ESG 信息披露的资本市场后果，指出强制披露降低了信息不对称程度。"},{"authors":"许静, 高远","title":"绿色信贷政策对企业债务融资成本的影响","journal":"金融研究","year":"2021","doi":"10.3969/j.issn.1002-7246.2021.12.006","abstract":"该文评估绿色信贷政策对企业债务融资成本的影响，结果显示政策实施之后债务融资成本明显下降。"},{"authors":"范平, 苏萌","title":"企业 ESG 评级分歧与资本市场定价效率","journal":"经济管理","year":"2024","doi":"10.19616/j.cnki.bmj.2024.06.009","abstract":"该文分析企业 ESG 评级分歧对资本市场定价效率的影响，发现评级分歧会削弱 ESG 信息的定价作用。"}]'
