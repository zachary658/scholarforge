version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # 避免一次性大版本跃迁带来破坏性变更；安全更新仍会自动开 PR
    groups:
      server-production-minor:
        dependency-type: "production"
        update-types: ["minor", "patch"]
        patterns: ["*"]
      server-development-minor:
        dependency-type: "development"
        update-types: ["minor", "patch"]
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      client-production-minor:
        dependency-type: "production"
        update-types: ["minor", "patch"]
        patterns: ["*"]
      client-development-minor:
        dependency-type: "development"
        update-types: ["minor", "patch"]
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/research-engine"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      research-engine-minor:
        update-types: ["minor", "patch"]
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
