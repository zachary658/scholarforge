name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  server-test:
    name: Server (install / audit / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # 依赖审计门禁：用允许列表替代 `|| true`，仅审计生产依赖（--omit=dev，见脚本头注释）。
      # 仅当所有 high/critical 漏洞的 GHSA 编号都在 server/audit-allowlist.json 中时才通过；
      # 新出现的未列出的高危漏洞会直接使 CI 失败。
      - name: npm audit (allowlist gate)
        run: node ../scripts/audit-allowlist.mjs
      - run: npm test
      # 生成质量门禁：Promptfoo 在预置 fixture 上验证断言逻辑（mock 模式，离线确定性）。
      # 覆盖引用真实性 / 证据可溯源 / 数据不编造 / 大纲一致性 / 格式合规五个维度。
      - name: Promptfoo quality gate (mock)
        run: npm run eval

  client-build:
    name: Client (install / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  research-engine:
    name: Research engine (lint / compile / audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research-engine/requirements.txt
      - name: Install runtime and quality tools
        run: python -m pip install -r requirements.txt ruff pip-audit
      - name: Check for syntax and undefined-name errors
        run: ruff check --select E9,F63,F7,F82 .
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Audit Python runtime dependencies
        run: pip-audit -r requirements.txt

  docker-build:
    name: Docker image build (validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t scholarforge:ci .
