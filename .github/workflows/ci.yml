name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  server-test:
    name: Server (install / audit / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # 依赖审计门禁：用允许列表替代 `|| true`。
      # 仅当所有 high/critical 漏洞的 GHSA 编号都在 server/audit-allowlist.json 中时才通过；
      # 新出现的未列出的高危漏洞会直接使 CI 失败。
      - name: npm audit (allowlist gate)
        run: node ../scripts/audit-allowlist.mjs
      - run: npm test

  client-build:
    name: Client (install / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker-build:
    name: Docker image build (validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t scholarforge:ci .
