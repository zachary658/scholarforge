name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  server-test:
    name: Server (install / audit / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      # promptfoo 的传递依赖（playwright）默认会下载 ~200MB Chromium，
      # 后端测试/lint 用不到浏览器，跳过可显著加速安装。
      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci
      - name: Lint (ESLint gate)
        run: npm run lint
      # 依赖审计门禁：用允许列表替代 `|| true`，仅审计生产依赖（--omit=dev，见脚本头注释）。
      # 仅当所有 high/critical 漏洞的 GHSA 编号都在 server/audit-allowlist.json 中时才通过；
      # 新出现的未列出的高危漏洞会直接使 CI 失败。
      - name: npm audit (allowlist gate)
        run: node ../scripts/audit-allowlist.mjs
      - run: npm test
      - name: End-to-end smoke test
        env:
          NODE_ENV: development
          JWT_SECRET: ci-smoke-jwt-secret-at-least-32-characters
          ADMIN_PASSWORD: Admin123456
          LOG_TO_FILE: "false"
        run: |
          npm start > /tmp/scholarforge-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/api/health > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/scholarforge-smoke.log
              exit 1
            fi
            sleep 1
          done
          node scripts/smoke.mjs

  # 生成质量门禁拆分为独立 job：普通后端测试不必安装 promptfoo 全套评测依赖。
  server-quality-gate:
    name: Server quality gate (promptfoo, mock)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci
      # Promptfoo 在预置 fixture 上验证断言逻辑（mock 模式，离线确定性）。
      # 覆盖引用真实性 / 证据可溯源 / 数据不编造 / 大纲一致性 / 格式合规五个维度。
      - name: Promptfoo quality gate (mock)
        run: npm run eval

  client-build:
    name: Client (install / lint / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Lint (ESLint gate)
        run: npm run lint
      - run: npm test
      - run: npm run build

  research-engine:
    name: Research engine (lint / test / compile / audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            research-engine/requirements.txt
            research-engine/requirements-full.txt
      - name: Install runtime and quality tools
        run: python -m pip install -r requirements.txt ruff pip-audit pytest httpx
      - name: Run unit tests
        run: python -m pytest tests/ -q
      - name: Check for syntax and undefined-name errors
        run: ruff check --select E9,F63,F7,F82 .
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Audit Python runtime dependencies
        run: pip-audit -r requirements.txt
      - name: Resolve full-mode dependency tree
        run: python -m pip install --dry-run --ignore-installed --report dependency-report.json -r requirements-full.txt
      - name: Enforce full-mode license policy
        run: python scripts/check_dependency_policy.py dependency-report.json

  docker-build:
    name: Docker image build (validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t scholarforge:ci .
